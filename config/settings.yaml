# Options Wheel Strategy Configuration

# Which strategy profile this config drives (FC-075). 'wheel' is the historical
# default; the covered-call strategy runs from config/covered_call.yaml.
strategy_id: wheel

# Alpaca API Settings
alpaca:
  # Controls which Alpaca API endpoints to use (paper vs live)
  # Set to true to use paper trading endpoints (required for current API subscription)
  # Trades are ALWAYS executed to Alpaca - this only controls which API endpoints are used
  paper_trading: true
  # API credentials (use environment variables)
  api_key_id: "${ALPACA_API_KEY}"
  secret_key: "${ALPACA_SECRET_KEY}"
  # Account-number interlock (FC-075 Seam 2): the service refuses to trade if the
  # live Alpaca account number does not match this. Pins right-code to
  # right-credentials. This is the wheel's paper account.
  expected_account_number: "PA3D36DVXSZ2"

# Trading Strategy Parameters
strategy:
  # Scan-to-execution coordination
  # Maximum age (in minutes) for opportunities to be considered valid for execution
  # Prevents execution of stale scans that may have outdated prices
  opportunity_max_age_minutes: 30

  # Target days to expiration for new positions
  put_target_dte: 7
  call_target_dte: 7
  
  # Delta thresholds for option selection
  put_delta_range: [0.10, 0.20]
  # FC-029 (R1): tightened from [0.30, 0.70] to reduce called-away exposure.
  # See docs/plans/fc-029.md and docs/investigations/strategy-review-2026-05-07.md.
  call_delta_range: [0.15, 0.25]

  # FC-072: how far past mid a sell-to-open is priced, as a fraction of the
  # bid/ask spread, off a quote REFRESHED at execution time (the :00 scan /
  # :15 run gap, not the spread, is what moved these orders historically).
  # 0.0 = rest exactly at mid; 0.5 = sit on the ask. Validated to [0.0, 0.5].
  # Consumers: CallSeller.execute_call_sale / PutSeller.execute_put_sale.
  #
  # The call leg's old `premium * 0.95` sat about AT THE BID on this book, so
  # it was marketable rather than a donation (realised sum(mid - fill) over the
  # journaled call fills: -$87). Moving to mid trades fill rate for price:
  # expect ~75-80% fills at mid against ~90% marketable, worth ~+$5/write
  # gross. Do not flip either knob without the two-week readout in
  # docs/plans/fc-072.md.
  call_limit_spread_fraction: 0.0
  # 0.10 is the value the put leg has always used (was hardcoded). Keeping it
  # here reproduces today's price on any normal book; the key exists so both
  # legs are configured the same way.
  put_limit_spread_fraction: 0.10

  # CRITICAL: Cost basis protection for covered calls
  # Never sell calls below stock cost basis to avoid guaranteed losses
  # This is automatically enforced in code - strikes below cost basis are rejected
  # FC-029 (R2): cost basis is sourced from wheel_state (the put-strike-of-the-
  # assigning-OPASN, captured at OPASN time), with BQ fallback for silent
  # assignments and Alpaca fallback for non-wheel positions. See docs/plans/fc-029.md.
  
  # Minimum premium thresholds (in dollars)
  min_put_premium: 0.50
  min_call_premium: 0.30
  
  # Stock universe criteria (optimized for cloud execution)
  min_stock_price: 10.00  # Lowered to allow high-volume stocks like Ford (F)
  max_stock_price: 400.00
  min_avg_volume: 2000000  # 2M shares daily average for better liquidity

# Risk Management
#
# FC-069 S1 deleted the breadth/exposure knobs that lived here
# (`max_positions_per_stock`, `max_total_positions`, `max_exposure_per_ticker`,
# `max_portfolio_allocation`, `min_cash_reserve`). None had a preventive
# consumer on the live path. The controls that actually bound this account are
# `max_position_size` below (per-position, floats with equity), the
# buying-power ledger in `ExecutionEngine.select_batch`, the one-option-
# position-per-underlying invariant (scanner skip + batch dedup + share
# ledger), and the execute-time cost-basis floor. See docs/plans/fc-069.md.
risk:
  # Portfolio allocation limits
  max_position_size: 0.35         # 35% per position (allows up to $35k positions)

  # Stop loss settings (separate controls for puts vs calls)
  use_put_stop_loss: false        # Take assignment instead of stopping out puts
  use_call_stop_loss: false       # Disabled (FC-010): assignment is profitable by design, FC-006 handles rolling
  put_stop_loss_percent: 0.50     # Put stop loss threshold (ignored if disabled)
  call_stop_loss_percent: 0.50    # Call stop loss threshold
  stop_loss_multiplier: 1.5       # Multiplier for short-term options (accounts for time decay)
  
  # Profit taking settings - Dynamic DTE-based targets
  profit_taking:
    # Enable dynamic DTE-based profit targets (vs static 50%)
    use_dynamic_profit_target: true

    # Fallback to this if dynamic is disabled or DTE cannot be determined
    static_profit_target: 0.50

    # DTE-based profit target bands (optimized for 7 DTE options)
    # EASILY TUNABLE - just edit these percentages and redeploy
    dte_bands:
      - dte: 7
        profit_target: 0.35
        description: "Day 0: Just opened — raised from 0.20 to reduce day-1 churn"

      - dte: 6
        profit_target: 0.40
        description: "Day 1: Raised from 0.25 — overnight moves shouldn't trigger close"

      - dte: 5
        profit_target: 0.35
        description: "Day 2: Raised from 0.30 — moderate decay, let theta work"

      - dte: 4
        profit_target: 0.45
        description: "Day 3: Raised from 0.40 — acceleration beginning"

      - dte: 3
        profit_target: 0.50
        description: "Day 4: 9% daily theta (inflection point)"

      - dte: 2
        profit_target: 0.60
        description: "Day 5: 12% daily theta (rapid decay zone)"

      - dte: 1
        profit_target: 0.70
        description: "Day 6: 17% daily theta (extreme decay, peak theta)"

      - dte: 0
        profit_target: 0.80
        description: "Day 7: Expiration day (close by 3:45pm ET to avoid risk)"

    # Safety bounds (prevent extreme targets)
    min_profit_target: 0.15   # Never exit below 15% profit
    max_profit_target: 0.85   # Never wait beyond 85% profit

    # Default for DTE > 7 (if ever selling longer-dated options)
    default_long_dte_target: 0.20

  # FC-069 S1 deleted `profit_target_percent` (self-labeled legacy, zero
  # consumers), `max_iv_rank` / `min_iv_rank` (never had a Config property; no
  # IV-rank computation exists anywhere in src/), and the whole
  # `gap_risk_controls:` block together with `src/risk/gap_detector.py`.
  # Gap risk is absent by decision: FC-036's study said don't arm the execution
  # gate, and FC-049 found the stage-2 filter would have refused 123 of 327
  # real entries. Any evidence-based revival starts from git history at
  # pre-S1 main SHA afb6698. See docs/plans/fc-069.md item 5.

# Stock Universe
stocks:
  # High-quality, liquid stocks suitable for wheel strategy
  # TSLA removed due to extreme volatility and gap risk
  #
  # Low-price candidates (under $30) for higher volume trading:
  # - F (Ford): ~$12, automotive, excellent liquidity (2M+ OI)
  # - PFE (Pfizer): ~$25, pharma, excellent liquidity
  # - KMI (Kinder Morgan): ~$28, energy infrastructure, good liquidity
  #
  # Mid-price candidates ($30-50) for balanced exposure:
  # - VZ (Verizon): ~$43, telecom, dividend aristocrat, excellent liquidity
  symbols:
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "AMZN"
    - "NVDA"
    - "AMD"
    - "QQQ"
    - "SPY"
    - "IWM"
    - "UNH"
    - "F"      # Ford Motor - $12
    - "PFE"    # Pfizer - $25
    - "KMI"    # Kinder Morgan - $28
    - "VZ"     # Verizon - $43

  # FC-096 Phase A — the EVALUATION universe. Symbols here are never traded,
  # never scanned and never sized; the live scanner reads `symbols` above and
  # has no reader for this key at all (a structural test in
  # tests/test_candidate_universe.py enforces that).
  #
  # THE ONLY CONSUMER is `python main.py --command backfill` — the weekly
  # `data-backfill` Cloud Run Job — which keeps bars and chain-lake days
  # current for `symbols + candidates` so a candidate can be backtested on
  # demand instead of waiting ~5-20 min/symbol-year for a cold materialise.
  #
  # To onboard one: add it here in a config PR, then run the Job once with
  # BACKFILL_SYMBOLS=<sym> (or wait for Saturday). Refresh the committed
  # earnings table FIRST — see the checklist in docs/BACKTEST_ENGINE.md; a
  # symbol missing from it replays with the FC-013 gate silently passing
  # everything through. Promotion to live trading is a separate, deliberate
  # move of the symbol into `symbols` above.
  candidates: []

# FC-069 S1 deleted the `monitoring:` block (7 keys). `check_interval_minutes`
# read as live cadence config while the real cadence is Cloud Scheduler — a
# standing operator trap; the other six had no reader of any kind.

# Call Rolling — FC-006, revived by FC-078 as daily credit-only defensive rolls.
#
# Evaluated every trading day at 15:30 ET; a roll executes only when the placed
# LIMIT prices net a credit, so a filled roll can never net a debit. The debit
# tolerance, the DTE-<=1 eligibility trap, the max-rolls counter (which read a
# state file that has never persisted) and both aggression pads are gone — see
# docs/plans/fc-078.md DD-6 for the fate of every removed knob.
#
# Kill switch without a deploy: ROLLER_ENABLED=false (env wins over this key).
# Debug without placing orders: ROLLER_DRY_RUN=true (env-only).
rolling:
  enabled: true
  itm_trigger_ratio: 0.98               # stock/strike >= this is roll-eligible
  max_extension_days: 14                # replacement expiry <= OLD expiry + N
  max_replacement_delta: 0.60           # upper rail only; no lower bound
  min_net_credit_per_contract: 0.00     # $/contract on the placed limits
  imminence_extrinsic_threshold: 0.20   # $/share extrinsic -> mid-based pricing
  btc_fill_timeout_seconds: 120
  fallback_strike_attempts: 2

# Earnings Calendar (Finnhub)
earnings:
  enabled: true
  cache_ttl_hours: 24
  blackout_days: 2
  lookahead_days: 90

# FC-069 S1 deleted the `logging:` block (5 keys). `Config` never exposed the
# section: `setup_logging` takes its arguments from the CLI (main.py) or
# hardcodes them (cloud_run_server.py). The block configured nothing.