# Covered-Call Strategy Configuration (FC-075)
#
# A standalone covered-call strategy that runs in its OWN Alpaca account,
# isolated from the wheel. Selected by a Cloud Run service via
# STRATEGY_CONFIG=config/covered_call.yaml.
#
# Scope note: FC-075 Phase 1 only wires ISOLATION (this file must load, validate,
# and supply strategy_id / expected_account_number / opportunity_bucket /
# dataset). The strategy: and universe: tunables below are consumed by the
# Phase 2 covered-call engine, which is gated on FC-068 + FC-069 and will be
# re-derived by a design pass. Values here are sensible starting defaults,
# operator-tunable (see the plan's OQ-2) — NOT final.

strategy_id: covered_call

alpaca:
  paper_trading: true
  api_key_id: "${ALPACA_API_KEY}"
  secret_key: "${ALPACA_SECRET_KEY}"
  # Account-number interlock (Seam 2): the covered-call paper account. The
  # service refuses to trade if the live account number does not match.
  expected_account_number: "PA37XLNWDLB3"

# GCS opportunity handoff, strategy-scoped so this service and the wheel cannot
# read each other's scan output (Seam 1). Bucket is provisioned in Phase 3.
gcs:
  opportunity_bucket: "covered-call-opportunities"

# Analytics dataset, strategy-scoped. LIVE-WIRED by Seam 4: all five BigQuery
# writers take this dataset as a required constructor argument and stamp
# strategy_id on every row, so this profile cannot write the wheel's tables.
# The dataset itself is still provisioned + IAM-granted by an operator in
# Phase 3 — the writers deliberately do not create datasets, so until then this
# profile's writers come up disabled (NotFound) and write nothing anywhere.
bigquery:
  dataset: "covered_call"

# Covered-call trading parameters — this strategy's OWN tunables, distinct from
# the wheel's (requirement #3). No put phase.
strategy:
  # Days to expiration for the calls written against held shares. This is the
  # hard DTE CEILING for candidates (market_data.py _check_call_criteria_detailed).
  # 7 -> 14 (operator, 2026-08-27): three live days showed the [0.15,0.25]
  # delta band and the $0.30 premium floor have an empty intersection on a
  # <=7-DTE chain at current IV (UNH zero-qualified while ABOVE basis).
  # Week-2 expiries price the same deltas above the floor.
  # See docs/plans/fc-075-cc-deploy-step.md.
  call_target_dte: 14
  # Delta band for call selection. Own band; starts at the wheel's tightened
  # value and is tuned independently once there's covered-call backtest data.
  call_delta_range: [0.15, 0.25]
  # Minimum acceptable call premium (per share).
  min_call_premium: 0.30
  # Price/volume screening bounds. NOT a selection knob on this profile — the
  # universe is holdings-derived, so nothing here picks a symbol. They are
  # present because `MarketDataManager.get_stock_metrics` hard-indexes
  # `config.min_stock_price` / `max_stock_price` / `min_avg_volume`, and the
  # call path reaches it on EVERY chain fetch
  # (`get_option_chain_with_analysis`, market_data.py) and again in
  # `_create_call_opportunity`. With the keys missing the method raised KeyError
  # *after* the quote fetch, the broad except returned {}, and the profile logged
  # `stock_metrics_error` on 100% of symbol-scans 2026-08-24..31 (no candidate
  # ever reached the opportunity builder, where current_price=0 would have
  # failed the symbol closed as `call_scan_skipped_quote_unavailable`). On the
  # call path only `current_price` (and the unconsumed `moneyness`) come out of
  # that dict; `suitable_for_wheel` / `meets_*_criteria` are read on the put
  # path only, which this profile skips. Bounds are deliberately wide so no held
  # symbol is ever logged as "not suitable" for being cheap, expensive or thin —
  # the operator, not a screen, decides what this account holds. Validated at
  # load for every profile (Config._validate_config).
  min_stock_price: 1.00
  max_stock_price: 100000.00
  min_avg_volume: 0
  # FC-072: how far past mid a sell-to-open is priced, as a fraction of the
  # bid/ask spread, off a quote REFRESHED at execution time. 0.0 = rest at mid.
  # Validated to [0.0, 0.5]. Consumer: CallSeller.execute_call_sale.
  # Starts at the wheel's value on purpose (FC-072 open question: this profile's
  # 14-DTE calls are richer and its spreads tighter, so it is the likelier
  # candidate for 0.10 — but one variable at a time, and this profile has no
  # fill-rate baseline of its own yet).
  call_limit_spread_fraction: 0.0
  # This profile writes no puts. The key is carried at the shared default so the
  # two profiles validate identically and a future put phase cannot inherit a
  # silently different price. Consumer: PutSeller.execute_put_sale (wheel only).
  put_limit_spread_fraction: 0.10
  # Strike floor: the hard `strike >= avg_entry_price` rule is enforced by the
  # shared CostBasisResolver (FC-050/FC-065) on the execute path — there is no
  # config knob for it (a `floor_mode` key was removed here: it had no consumer,
  # and avg_entry_price is the only supported mode).
  # FC-069 S1 deleted the breadth/exposure knobs that were mirrored here from
  # the wheel (`max_positions_per_stock`, `max_total_positions`,
  # `max_exposure_per_ticker`) along with their Config properties and
  # validation. Covered-call sizing is `floor(uncommitted_shares / 100)` per
  # underlying — it never touches dollars. `max_position_size` below has no
  # consumer on this profile (it sizes PUTS, of which there are none); it is
  # kept only to satisfy the shared risk-section validation. The real 4x-margin
  # discipline is the equity-basis exposure alert (risk block below).

# Holdings-derived universe (requirement: no configured stock list). The engine
# writes calls against whatever equity it finds in the account. These controls
# only EXCLUDE or VALIDATE — they never select. Consumed in Phase 2.
universe:
  # Symbols the bot must never write calls against (operator opt-out). Empty by
  # default: the operator invariant is "this account holds nothing you are
  # unwilling to have called away."
  excluded_symbols: []
  # Inventory validator thresholds (Phase 2): a holding failing these is skipped
  # + logged, never traded.
  # SUSPENDED 2026-09-01 (was 500): the option-chain source
  # (`AlpacaClient.get_option_chain` — snapshot endpoint) hardcodes
  # `open_interest: 0` for every contract, so any floor here rejects EVERY
  # strike that survives the other gates (prod 2026-08-28: ~114 GOOGL / ~86 UNH
  # per scan died here, unlogged). `null` skips the check (Config property →
  # None). This suspends the OI half of the FC-075 DD-3 inventory validator;
  # restore the floor when FC-097 sources real OI from /v2/options/contracts.
  min_open_interest: null
  max_spread_pct: 0.10          # reject chains wider than 10% bid/ask
  # (earnings_exclusion_days removed: no consumer, and a symbol-level N-day
  #  blackout is the design FC-013 rev 2.2 rejected for the call leg — the span
  #  predicate below is the real gate. See the `earnings:` block.)

# Earnings gate (FC-013), enabled for this profile. A symbol with unknown
# earnings fails closed (no call written); the per-candidate span predicate
# refuses only strikes that expire INTO an earnings event. Requires
# FINNHUB_API_KEY bound on the covered-call service (Phase 3) — without it every
# symbol resolves UNKNOWN and the engine writes nothing (safe, loud, useless).
earnings:
  enabled: true
  cache_ttl_hours: 24
  lookahead_days: 90

risk:
  # `max_portfolio_allocation` and `min_cash_reserve` deleted by FC-069 S1
  # (no consumer on either profile).
  max_position_size: 0.35
  # 4x-margin discipline (Phase 0 found this account is 4x vs the wheel's 2x):
  # size against equity, never buying_power, and alert if long exposure exceeds
  # equity. Consumed in Phase 2.
  sizing_basis: equity
  max_long_market_value_pct_of_equity: 1.0
  # Shared-machinery keys the reused call/monitor path hard-indexes today
  # (Config.use_call_stop_loss / use_put_stop_loss / stop_loss_multiplier and
  # the profit_taking accessors). Present so the reused code does not KeyError
  # when the Phase 2 engine drives it. The Phase 2 design pass tunes these for
  # the covered-call target; values here mirror the wheel's call side as a
  # starting point. Stop-losses off (FC-010 disabled call stop-losses).
  use_put_stop_loss: false
  use_call_stop_loss: false
  stop_loss_multiplier: 1.5
  profit_taking:
    use_dynamic_profit_target: true
    static_profit_target: 0.50
    min_profit_target: 0.30
    max_profit_target: 0.80
    default_long_dte_target: 0.50
    # DTE-band profit targets for /monitor early-close. Copied from the wheel's
    # call side as a starting point (operator-tunable, OQ-1). An empty list made
    # every close-evaluation fall through to the static-fallback warning.
    dte_bands:
      - dte: 7
        profit_target: 0.35
      - dte: 6
        profit_target: 0.40
      - dte: 5
        profit_target: 0.35
      - dte: 4
        profit_target: 0.45
      - dte: 3
        profit_target: 0.50
      - dte: 2
        profit_target: 0.60
      - dte: 1
        profit_target: 0.70
      - dte: 0
        profit_target: 0.80

# The `monitoring:` block was deleted by FC-069 S1 (card 17) on both profiles:
# zero consumers, and `check_interval_minutes` misrepresented Cloud Scheduler's
# cadence as config.
