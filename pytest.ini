[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    real_bq_lookup: opts out of the autouse CostBasisResolver._lookup_assignment_basis stub in tests/conftest.py, so the resolver's real BigQuery lookup path runs (against a patched client). Named for CallSeller, whose resolver FC-068 deleted; the resolver is now owned by OptionsScanner and CallRoller.
    real_finnhub_fetch: exercises EarningsCalendarService._fetch_earnings against a mocked finnhub client (still no network)
