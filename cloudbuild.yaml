  # ---------------------------------------------------------------------------
  # FIRST DEPLOY ONLY — create `sim-service` before the canary chain touches it.
  #
  # `gcloud run deploy --no-traffic` is REJECTED when the service does not exist:
  #   ERROR: (gcloud.run.deploy) --no-traffic not supported when creating a new
  #   service.
  # ...which is exactly what killed build `2e1b180`'s deploy. The other three
  # chains never met it because their services were provisioned by hand long
  # before their steps existed; `sim-service` is the first service this repo
  # creates from cloudbuild, so it is the first to need a creation path at all.
  #
  # Deliberately a SEPARATE step rather than a branch inside `deploy-sim-canary`.
  # That step's full flag set is frozen in `tests/fixtures/cloudbuild_contract.json`
  # and `--no-traffic` / `--tag=canary` are the flags that MAKE it a canary; moving
  # them behind a shell variable so they could be omitted at creation would have
  # meant deleting them from the freeze, and the freeze is what stops a canary
  # quietly becoming a live deploy. Here the canary step is byte-identical to what
  # it was and only gains a `waitFor` edge.
  #
  # The bootstrap revision deliberately takes NO `--revision-suffix` and NO
  # `--tag`: it must not collide with the revision the next step names, and the
  # smoke reads the canary-tagged URL, which only that next revision has. So the
  # first build produces two revisions — this one serving 100% for a minute or
  # two, then the canary, which `promote-sim` moves traffic to. Every later build
  # is a no-op here (one `describe`, ~1 s).
  #
  # `promote-sim` is UNCHANGED and does NOT branch on the marker below: on both
  # paths the canary revision is created `--no-traffic`, so `--to-latest` is
  # exactly the right instruction either way. The marker is written for the LOG,
  # so a first build explains itself, and is asserted by the contract test rather
  # than consumed by a later step.
  #
  # Same flags as the canary deploy minus the three traffic/naming ones — an
  # `--set-env-vars` drift between the two would leave the bootstrap revision
  # running a different configuration than everything after it.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        if gcloud run services describe sim-service --region=us-central1 \
             --format='value(metadata.name)' >/dev/null 2>&1; then
          echo "exists" > /workspace/sim-service-bootstrap.txt
          echo "sim-service already exists — the canary chain handles it from here"
          exit 0
        fi
        echo "sim-service does not exist. FIRST DEPLOY: creating it WITHOUT"
        echo "--no-traffic (Cloud Run rejects that flag at creation) and without"
        echo "a revision suffix or tag, so the canary step can name its own."
        if ! gcloud run deploy sim-service \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA \
          --region=us-central1 \
          --command=python \
          --args=deploy/sim_service.py \
          --no-allow-unauthenticated \
          --no-cpu-throttling \
          --memory=2Gi \
          --cpu=1 \
          --concurrency=1 \
          --max-instances=2 \
          --min-instances=0 \
          --timeout=120 \
          --set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID,STRATEGY_CONFIG=config/settings.yaml,GIT_COMMIT=$COMMIT_SHA,CHAIN_LAKE_BUCKET=options-wheel-chain-lake,SIM_ARTIFACT_BUCKET=gen-lang-client-0607444019-options-data \
          --set-secrets=ALPACA_API_KEY=alpaca-api-key:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest,FINNHUB_API_KEY=finnhub-api-key:latest \
          > /workspace/create-log-sim-service.txt 2>&1; then
          cat /workspace/create-log-sim-service.txt
          if grep -q 'already exists' /workspace/create-log-sim-service.txt; then
            echo "another build created it first — that is success, not failure"
            echo "created" > /workspace/sim-service-bootstrap.txt
            exit 0
          fi
          echo "FAIL: could not create sim-service"
          exit 1
        fi
        cat /workspace/create-log-sim-service.txt
        echo "created" > /workspace/sim-service-bootstrap.txt
        echo "sim-service CREATED; the canary step now deploys this build's revision"
    id: 'create-sim-service-if-absent'
    waitFor: ['promote-dashboard', 'serialize-builds']

  # ---------------------------------------------------------------------------
  # FC-096 Phase B PR-c — the interactive `sim-service` chain (4th canary chain).
  #
  # Same image as the wheel (one image; the COMMAND selects the work — FC-075's
  # rule), running `deploy/sim_service.py` instead of `deploy/cloud_run_server.py`.
  # It answers an operator's ad-hoc simulation in seconds where the
  # `backtest-sweep` Job pays a ~3-minute container start, and it scales to zero
  # between requests.
  #
  # POSITION: behind `promote-dashboard`, ahead of the two Job deploys, and the
  # placement is load-bearing for the same reason theirs is. This service is a
  # measurement tool. It is brand new, it is the first thing in this project to
  # use `--no-cpu-throttling`, and its smoke test makes an authenticated HTTP
  # call — three ways to fail that have nothing to do with the trading bot. Any
  # of them must fail the build LOUDLY and only AFTER the wheel, covered-call and
  # dashboard revisions have their traffic.
  #
  # THE DEPLOY FLAGS, each because of something:
  #   --no-cpu-throttling  Instance-based billing. `/simulate` returns 202 and the
  #                        replay continues on a worker thread; under Cloud Run's
  #                        default request-based billing the CPU is throttled the
  #                        moment that response returns and the replay starves —
  #                        nothing ever supplies an in-flight request, because the
  #                        console polls BigQuery through the dashboard and never
  #                        touches this service. ~$0.09/hr while an instance is
  #                        ALIVE, $0 when fully idle.
  #   --concurrency=1      The engine mutates process-global state during a replay
  #                        (`ExecutionEngine._failed_symbols`, the frozen clock,
  #                        stdlib logger levels, the analytics singleton). Two
  #                        replays in one process would not crash; they would
  #                        corrupt each other's numbers silently. The service also
  #                        refuses a second request itself; this flag is what stops
  #                        one queueing invisibly behind the first.
  #   --memory=2Gi         The tmpfs bar and chain caches count against memory.
  #                        512Mi (the wheel's) OOMs on a multi-symbol window.
  #   --cpu=1              Materialisation is single-threaded; a second vCPU buys
  #                        nothing and doubles the instance-billed rate.
  #   --timeout=120        Requests are SHORT by design now — validate, guard,
  #                        dedup, hand back a run_id. A long request timeout would
  #                        only mask a design regression back to the synchronous
  #                        shape the plan's round-1 review killed.
  #   --max-instances=2    A second instance is a second concurrent simulation in a
  #                        separate PROCESS, which is safe. Two is enough for an
  #                        operator plus a retry and bounds the bill.
  #   --min-instances=0    D1: scale to zero, pay nothing idle. Scheduled
  #                        market-hours warmth stays a documented one-flag option.
  #
  # `--set-secrets` IS passed here, unlike the wheel and covered-call steps whose
  # comments say not to. Those services were provisioned by hand and their secret
  # bindings persist from that provisioning; `sim-service` does not exist yet and
  # this step CREATES it, so a first deploy without the bindings would produce a
  # service whose `Config()` cannot validate — it fails at startup, the smoke test
  # fails, and the build goes red for a reason no log explains. The names are the
  # `backtest-sweep` Job's, verbatim.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    env:
      - 'BUILD_ID=$BUILD_ID'
      - 'SHORT_SHA=$SHORT_SHA'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        SUFFIX="$${SHORT_SHA}-$${BUILD_ID:0:8}"
        if [ -z "$${SHORT_SHA}" ]; then SUFFIX="b$${BUILD_ID:0:8}"; fi
        REV="sim-service-$${SUFFIX}"
        echo "Deploying revision $${REV}"
        DEPLOYED=""
        for attempt in 1 2 3; do
          if gcloud run deploy sim-service \
            --image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA \
            --region=us-central1 \
            --command=python \
            --args=deploy/sim_service.py \
            --no-allow-unauthenticated \
            --no-cpu-throttling \
            --memory=2Gi \
            --cpu=1 \
            --concurrency=1 \
            --max-instances=2 \
            --min-instances=0 \
            --timeout=120 \
            --set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID,STRATEGY_CONFIG=config/settings.yaml,GIT_COMMIT=$COMMIT_SHA,CHAIN_LAKE_BUCKET=options-wheel-chain-lake,SIM_ARTIFACT_BUCKET=gen-lang-client-0607444019-options-data \
            --set-secrets=ALPACA_API_KEY=alpaca-api-key:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest,FINNHUB_API_KEY=finnhub-api-key:latest \
            --no-traffic \
            --tag=canary \
            --revision-suffix=$${SUFFIX} \
            > /workspace/deploy-log-sim-service.txt 2>&1; then
            cat /workspace/deploy-log-sim-service.txt
            DEPLOYED="yes"
            break
          fi
          cat /workspace/deploy-log-sim-service.txt
          if grep -q 'already exists' /workspace/deploy-log-sim-service.txt; then
            echo "revision $${REV} already exists — an earlier attempt created it; verifying below"
            DEPLOYED="yes"
            break
          fi
          if grep -q 'Conflict for resource' /workspace/deploy-log-sim-service.txt; then
            if [ "$${attempt}" = "3" ]; then
              echo "attempt 3/3 — Cloud Run version conflict, no retries left"
              break
            fi
            echo "attempt $${attempt}/3 — Cloud Run version conflict (out-of-band write); retrying in 20s"
            sleep 20
            continue
          fi
          echo "FAIL: deploy of sim-service failed"
          exit 1
        done
        if [ -z "$${DEPLOYED}" ]; then
          echo "FAIL: deploy of sim-service did not succeed after 3 attempts"
          exit 1
        fi
        if ! gcloud run revisions describe "$${REV}" --region=us-central1 \
             --format='value(metadata.name)'; then
          echo "FAIL: revision $${REV} does not exist after a successful deploy"
          exit 1
        fi
        echo "$${REV}" > /workspace/rev-sim-service.txt
        echo "Deployed canary revision: $${REV}"
    id: 'deploy-sim-canary'
    waitFor: ['create-sim-service-if-absent', 'promote-dashboard', 'serialize-builds']

  # LIGHT smoke, in two parts, and the split is deliberate (plan §B3).
  #
  # Part 1 — the readiness poll every other chain does, pinned to THIS build's
  # revision. It is the hard gate: for an ASGI service, "Ready" means uvicorn
  # bound the port and `create_app()` imported, which is where a broken
  # dependency, a syntax error or a missing secret actually shows up.
  #
  # Part 2 — one `GET /health` and one `POST /simulate` against the canary tag's
  # URL. `/health` must return a NON-EMPTY engine identity (an empty one means
  # the service cannot hash its own tree, and the dashboard's baked value would
  # then key against nothing). `/simulate` accepts {200 dedup-hit | 202 accepted}
  # — BOTH, on purpose: the first deploy and a fresh project have no seeded spec
  # to hit, so demanding the 200 here would make the very first build red. The
  # strict dedup-hit assertion is ROLLOUT verification (plan §3), after the spec
  # is seeded, not a deploy gate.
  #
  # Part 2 needs an OIDC identity token for a private service, and minting one
  # from inside Cloud Build is NOT a capability this project has ever exercised.
  # If it cannot be minted, the step prints SMOKE_SIM_HTTP_UNAVAILABLE and exits
  # 0 rather than turning every merge red over an unproven capability — the
  # readiness gate above has already run. That degrade is the ONE thing rollout
  # step 3 must check: grep this step's log for `PASS: /health` and, if it says
  # SMOKE_SIM_HTTP_UNAVAILABLE instead, the HTTP half is a control that is
  # watching nothing and needs its own follow-up.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        REV=$(cat /workspace/rev-sim-service.txt)
        echo "Verifying sim-service canary revision $${REV} is ready..."
        READY=""
        for i in $(seq 1 30); do
          STATUS=$(gcloud run revisions describe "$${REV}" --region=us-central1 --format=json \
            | python3 -c "import json,sys;d=json.load(sys.stdin).get('status') or {};print(next((c.get('status','') for c in (d.get('conditions') or []) if c.get('type')=='Ready'),''))")
          echo "attempt $${i}/30 — sim canary $${REV} status: $${STATUS}"
          if [ "$${STATUS}" = "True" ]; then
            READY="yes"
            break
          fi
          if [ "$${STATUS}" = "False" ]; then
            echo "FAIL: sim canary revision $${REV} failed to become ready"
            exit 1
          fi
          sleep 5
        done
        if [ -z "$${READY}" ]; then
          echo "FAIL: timed out after 150s waiting for sim canary revision $${REV}"
          exit 1
        fi
        echo "PASS: sim canary revision $${REV} is ready"

        URL=$(gcloud run services describe sim-service --region=us-central1 --format=json \
          | python3 -c "import json,sys;t=(json.load(sys.stdin).get('status') or {}).get('traffic') or [];print(next((x.get('url','') for x in t if x.get('tag')=='canary'),''))")
        if [ -z "$${URL}" ]; then
          echo "FAIL: sim-service has no canary-tagged URL after a successful --tag=canary deploy"
          exit 1
        fi

        # UNAUTHENTICATED probe FIRST, and it is a HARD gate. It separates the
        # two states the authed call cannot tell apart:
        #   000  -> connection refused / DNS / timeout: the service is NOT up.
        #   401/403 -> the service IS up and IAM is enforcing. Proceed.
        #   200  -> the service is answering ANONYMOUS callers. That is a
        #           security defect on a service holding Alpaca credentials and
        #           writing to the sweep store; --no-allow-unauthenticated is in
        #           the deploy flags and something has overridden it.
        # Without this, a 403 on the authed call reads as "no engine identity"
        # and the build fails with a message about hashing, which is a lie.
        ANON=$(curl -s -o /dev/null -w '%{http_code}' --max-time 300 "$${URL}/health" || echo "000")
        echo "unauthenticated /health -> $${ANON}"
        case "$${ANON}" in
          401|403) echo "PASS: sim-service is up and refusing anonymous callers" ;;
          200) echo "FAIL: sim-service answered an UNAUTHENTICATED /health. It is deployed --no-allow-unauthenticated and holds broker credentials; something has made it public."
               exit 1 ;;
          000) echo "FAIL: could not reach $${URL} at all (connection refused, DNS or timeout). The revision reported Ready but the service is not serving."
               exit 1 ;;
          *) echo "FAIL: unauthenticated /health returned $${ANON}; expected 401/403 from a private service"
             exit 1 ;;
        esac

        TOKEN=$(gcloud auth print-identity-token --audiences="$${URL}" 2>/dev/null || true)
        if [ -z "$${TOKEN}" ]; then
          TOKEN=$(curl -s -H 'Metadata-Flavor: Google' \
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=$${URL}" 2>/dev/null || true)
        fi
        case "$${TOKEN}" in
          ey*) ;;
          *) echo "SMOKE_SIM_HTTP_UNAVAILABLE: could not mint an identity token for $${URL} from Cloud Build; the readiness and reachability gates above passed, the authenticated half did not run. See rollout step 3."
             exit 0 ;;
        esac

        HCODE=$(curl -s -o /workspace/smoke-sim-health.txt -w '%{http_code}' \
          --max-time 300 -H "Authorization: Bearer $${TOKEN}" "$${URL}/health" || echo "000")
        HEALTH=$(cat /workspace/smoke-sim-health.txt)
        echo "authenticated /health -> $${HCODE}: $${HEALTH}"
        if [ "$${HCODE}" = "403" ] || [ "$${HCODE}" = "401" ]; then
          echo "FAIL: the BUILD service account is not an invoker on sim-service."
          echo "The service is up (the unauthenticated probe above proved it) and this"
          echo "token was rejected — this is an IAM grant, NOT a missing engine identity."
          echo "Fix:  gcloud run services add-iam-policy-binding sim-service \\"
          echo "        --region=us-central1 --role=roles/run.invoker \\"
          echo "        --member=serviceAccount:799970961417@cloudbuild.gserviceaccount.com"
          echo "(and the same for the dashboard's service account, which the proxy needs)"
          exit 1
        fi
        IDENTITY=$(printf '%s' "$${HEALTH}" \
          | python3 -c "import json,sys;print((json.load(sys.stdin) or {}).get('engine_identity') or '')" \
          2>/dev/null || true)
        if [ -z "$${IDENTITY}" ]; then
          echo "FAIL: /health returned no engine_identity — the service cannot hash its own tree, so the dashboard's baked value keys against nothing"
          exit 1
        fi
        echo "PASS: /health engine_identity=$${IDENTITY}"

        # `X-Sim-Provenance: smoke` stamps `submitted_via='smoke'` on any rows
        # this writes, so the battery and trend queries exclude them. It matters
        # on every build whose engine identity moved: there is no prior run to
        # dedup against, so this POST is a REAL ~45 s replay.
        CODE=$(curl -s -o /workspace/smoke-sim-body.txt -w '%{http_code}' \
          --max-time 300 -X POST -H "Authorization: Bearer $${TOKEN}" \
          -H 'Content-Type: application/json' \
          -H 'X-Sim-Provenance: smoke' \
          -d @deploy/smoke_sim_spec.json "$${URL}/simulate" || echo "000")
        cat /workspace/smoke-sim-body.txt
        echo ""
        case "$${CODE}" in
          200) echo "PASS: /simulate deduplicated (200) — the seeded spec is present" ;;
          202) echo "PASS: /simulate accepted (202) — engine identity moved, so this ran a real replay; its rows are submitted_via='smoke'" ;;
          409)
            # THREE different 409s, and conflating them misdiagnoses the exact
            # log line rollout step 3 greps. A busy-409 names a run_id; a
            # coverage-409 carries missing_symbol_days; anything else (the
            # budget) means the smoke spec itself has grown too big.
            if grep -q 'missing_symbol_days' /workspace/smoke-sim-body.txt; then
              echo "SMOKE_SIM_SPEC_UNCOVERED: /simulate refused the smoke spec (409) — the service answered correctly, but deploy/smoke_sim_spec.json names a window the chain lake does not cover. Re-point it at a covered window (rollout step 3). Not failing the build over a data fact."
            elif grep -q '"run_id"' /workspace/smoke-sim-body.txt; then
              echo "SMOKE_SIM_BUSY: /simulate refused (409) because a replay of this spec is already in flight — an operator's run, or a previous build's smoke. The service answered correctly; nothing is wrong with the lake."
            else
              echo "FAIL: /simulate returned 409 for neither coverage nor busy — the smoke spec is over the service's own budget, which makes it not a smoke."
              exit 1
            fi
            ;;
          *) echo "FAIL: /simulate returned $${CODE}; expected 200 (dedup hit) or 202 (accepted)"
             exit 1 ;;
        esac
    id: 'smoke-test-sim'
    waitFor: ['deploy-sim-canary']

  # Shift traffic to the new sim-service revision (--to-latest; see promote-bot)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        REV=$(cat /workspace/rev-sim-service.txt)
        MY_IMAGE="us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA"
        for attempt in 1 2 3; do
          # Re-evaluated on EVERY attempt, never retried blind: see promote-bot.
          LATEST=$(gcloud run services describe sim-service --region=us-central1 \
            --format='value(status.latestReadyRevisionName)')
          echo "latestReadyRevisionName=$${LATEST}; this build=$${REV}"
          if [ "$${LATEST}" != "$${REV}" ]; then
            LATEST_IMAGE=$(gcloud run revisions describe "$${LATEST}" --region=us-central1 \
              --format='value(spec.containers[0].image)')
            if [ "$${LATEST_IMAGE}" = "$${MY_IMAGE}" ]; then
              echo "PROMOTING latest ready $${LATEST} (env-only change on this build's image)"
            else
              SERVING=$(gcloud run services describe sim-service --region=us-central1 --format=json \
                | python3 -c "import json,sys;t=(json.load(sys.stdin).get('status') or {}).get('traffic') or [];t=[x for x in t if (x.get('percent') or 0) > 0];t.sort(key=lambda x: -(x.get('percent') or 0));print(t[0].get('revisionName','') if t else '')")
              echo "FAIL: refusing to promote sim-service."
              echo "  serving now       : $${SERVING}"
              echo "  latest ready      : $${LATEST} (image $${LATEST_IMAGE})"
              echo "  this build's rev  : $${REV} (image $${MY_IMAGE})"
              echo "An out-of-band deploy of a DIFFERENT image landed during this build, so"
              echo "promoting would ship code this build never tested. Decide which one wins,"
              echo "then run:  gcloud run services update-traffic sim-service --to-latest"
              exit 1
            fi
          fi
          if gcloud run services update-traffic sim-service \
            --to-latest \
            --region=us-central1 \
            > /workspace/promote-log-sim-service.txt 2>&1; then
            cat /workspace/promote-log-sim-service.txt
            echo "PROMOTED: 100% traffic to latest"
            exit 0
          fi
          cat /workspace/promote-log-sim-service.txt
          if grep -q 'Conflict for resource' /workspace/promote-log-sim-service.txt \
             && [ "$${attempt}" != "3" ]; then
            echo "attempt $${attempt}/3 — Cloud Run version conflict (out-of-band write); retrying in 20s"
            sleep 20
            continue
          fi
          echo "FAIL: update-traffic for sim-service failed"
          exit 1
        done
    id: 'promote-sim'
    waitFor: ['smoke-test-sim']

  # Step 12: Deploy the ad-hoc scenario-sweep Cloud Run JOB (FC-060 Layer 3, D9).
  #
  # `gcloud run jobs deploy` is create-or-update, so this step both creates the
  # job on the merging build and keeps it on current `main` thereafter. That is
  # the whole point: `backtest-screen` is deliberately SHA-pinned (a monthly
  # screen must be reproducible), and nothing in this file used to update a Job
  # at all — which is how that job sat on a Layer-1 image with no `sweep`
  # command. An ad-hoc sweep has the opposite requirement: it answers a question
  # about the code as it is now.
  #
  # NOT gated by `serialize-builds`: this deploys no traffic and no revision, so
  # two builds racing here simply leaves the newer image on the job — which is
  # what serialization would have produced anyway. It DOES honour the superseded
  # marker, because a superseded build must not push its image onto the job that
  # the winning build is about to point at current code.
  #
  # It runs LAST, behind all three promotes, and that ordering is the point
  # (review round 1). This step can fail for a reason that has nothing to do
  # with the services — the build service account may lack `run.jobs.create`
  # until an operator grants it in the console. Placed earlier, or in parallel,
  # a failure here aborts the build and the wheel, covered-call and dashboard
  # revisions never get their traffic: an ad-hoc measurement tool would have
  # taken production deploys down with it. Behind the promotes it still fails
  # loudly and still blocks the build's SUCCESS — the operator finds out — but
  # only after the services are safely out.
  #
  # `--set-env-vars` REPLACES the whole env set on every deploy, so every
  # persistent Job env var must be listed here. GIT_COMMIT is the FC-081 wiring:
  # it is half of the sweep dedup key (D4), so a Job that ran without it would
  # key every sweep as if it had no commit.
  #
  # `--task-timeout=10800` (3h) for the same reason `backtest-screen` needs it:
  # a COLD window materialises at ~5.5 min/symbol (the warm figure is ~50 s), and
  # a 12-symbol sweep over a year of unseeded chains is comfortably over an hour.
  # A task killed at the timeout gets SIGTERM, which `main.py` turns into a
  # recorded `failed` row — but only if the timeout is generous enough that
  # hitting it means something is actually wrong. `services/sweeps.py` mirrors
  # this number as JOB_TASK_TIMEOUT_SECONDS; a contract test pins them equal.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        gcloud run jobs deploy backtest-sweep \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA \
          --region=us-central1 \
          --command=python \
          --args=main.py,--command,sweep,--spec-env,SWEEP_SPEC_JSON \
          --set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID,CHAIN_LAKE_BUCKET=options-wheel-chain-lake,GIT_COMMIT=$COMMIT_SHA \
          --set-secrets=ALPACA_API_KEY=alpaca-api-key:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest,FINNHUB_API_KEY=finnhub-api-key:latest \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=10800 \
          --max-retries=0 \
          --service-account=799970961417-compute@developer.gserviceaccount.com
    id: 'deploy-sweep-job'
    waitFor: ['promote-bot', 'promote-cc', 'promote-dashboard']

  # ---------------------------------------------------------------------------
  # FC-096 Phase A — the data-backfill Cloud Run Job.
  #
  # Same shape and the same position as `deploy-sweep-job`, and for the same
  # reasons: it runs the STRATEGY image (one image; the command selects the
  # work), it is gated on the superseded marker, and it sits BEHIND all three
  # promotes so that a `run.jobs.create` permission failure cannot abort the
  # build before the wheel/CC/dashboard revisions have their traffic. A Job
  # that nothing serves must never take a production deploy down with it.
  #
  # There are now TWO tail steps rather than one, which is why the contract test
  # asserts a tail SET instead of `ids[-1]`. Cloud Build runs them concurrently
  # (both waitFor the same three promotes); the measured sweep-Job step takes
  # ~4 s, so the second is noise against the build's ~340 s of headroom.
  #
  # `--set-env-vars` REPLACES the whole env set, so everything the Job needs is
  # listed here. Deliberately absent: BACKFILL_SYMBOLS / BACKFILL_HISTORY_DAYS /
  # BACKFILL_START / BACKFILL_END. All four are optional per-EXECUTION overrides
  # (`gcloud run jobs execute data-backfill --update-env-vars=...`) — a bare
  # weekly execution backfills the trailing 30 days of live + candidate symbols,
  # which is the whole point of the schedule. Baking a default window in here
  # would make the scheduler's behaviour a property of the last deploy.
  #
  # `--task-timeout=21600` (6h): the historical widening runs one symbol-year
  # per execution at measured cold rates (~5.5 min/symbol-month at 22-reach),
  # and the weekly freshness run finishes in minutes. A task killed at the
  # timeout gets SIGTERM, which main.py turns into a logged terminal summary —
  # but only if the timeout is generous enough that hitting it means something
  # is genuinely wrong. `--max-retries=0` for the sweep Job's reason: a retried
  # execution would re-walk the same days, and every day it already wrote is a
  # lake round-trip paid twice.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        [ -f /workspace/superseded ] && { echo "skip: superseded"; exit 0; }
        gcloud run jobs deploy data-backfill \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA \
          --region=us-central1 \
          --command=python \
          --args=main.py,--command,backfill \
          --set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID,CHAIN_LAKE_BUCKET=options-wheel-chain-lake,GIT_COMMIT=$COMMIT_SHA \
          --set-secrets=ALPACA_API_KEY=alpaca-api-key:latest,ALPACA_SECRET_KEY=alpaca-secret-key:latest,FINNHUB_API_KEY=finnhub-api-key:latest \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=21600 \
          --max-retries=0 \
          --service-account=799970961417-compute@developer.gserviceaccount.com
    id: 'deploy-backfill-job'
    waitFor: ['promote-bot', 'promote-cc', 'promote-dashboard']

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 30

# Service account for Cloud Build.
# IGNORED FOR TRIGGER BUILDS. The push trigger sets its own service account and that
# one wins: all 372 historical builds ran as
# 799970961417-compute@developer.gserviceaccount.com, not the account named here.
# This line still applies to a manual `gcloud builds submit` that does not pass
# --service-account, which is the only reason it is kept. Any IAM grant this config
# needs (see the FC-084 header) must go to the COMPUTE account, not this one.
serviceAccount: 'projects/gen-lang-client-0607444019/serviceAccounts/799970961417@cloudbuild.gserviceaccount.com'

# Timeout for the entire build
# Raised from 1200s by FC-084; REDONE ON THE RECORD by FC-096 Phase B PR-c, which
# adds the fourth canary chain (deploy-sim-canary -> smoke-test-sim -> promote-sim).
# Measured single-build runtime before this PR: max 827s (2026-08-31), p95 662s
# (queue time sits on top and does not count against the timeout: <=110s). The new
# chain is a deploy + a readiness poll + three HTTP calls + a promote, budgeted
# at +90-150s.
#
# **The honest caveat:** those curls carry `--max-time 300` each, so a genuinely
# cold instance (the measured 240s+ startup tail) can blow straight through the
# 150s budget on the unauthenticated probe alone, and a 202 that triggers a real
# ~45s replay adds more. The budget below describes the WARM case, which is
# every build after the first of a session; the cold worst case is bounded by
# the curls' own timeouts at ~+10 min and would hit the 1500s ceiling. That is
# the escalation rule's trigger, not a surprise:
#   single build worst case  = 827s + ~150s          = ~975s
#   waiting-pair worst case  = wait for the older build (<=975s)
#                            + this build's own deploy chain (~360s)          = ~1335s
# against 1500s, i.e. ~165s of headroom. `timeout:` therefore STAYS 1500s.
# **The escalation rule, per the plan:** if the measured post-merge single-build max
# exceeds 1000s, raise this to 1800s AND BUILD_TIMEOUT_SECONDS in serialize-builds in
# ONE commit — a contract test asserts the two stay equal, and the gate gives up 90s
# early so its explanation is what the log shows instead of an opaque TIMEOUT.
timeout: '1500s'

# Substitutions for build variables
substitutions:
  _SERVICE_NAME: 'options-wheel-strategy'
  _REGION: 'us-central1'

# Images to be pushed to registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:latest'
