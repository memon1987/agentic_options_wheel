# Cloud Build configuration for Options Wheel Strategy
# Automatically builds and deploys to Cloud Run when code is pushed to GitHub

steps:
  # Step 1: Run critical tests only (faster)
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pip install --no-cache-dir pytest pytest-mock pytest-asyncio
        python -m pytest tests/ -v --tb=short || exit 1
    id: 'run-tests'

  # Step 2: Build the trading bot container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'deploy/Dockerfile'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:latest'
      - '.'
    id: 'build-bot-image'
    waitFor: ['run-tests']

  # Step 3: Build the dashboard container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:latest'
      - '.'
    dir: 'dashboard'
    id: 'build-dashboard-image'
    waitFor: ['run-tests']

  # Step 4: Push the trading bot container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy'
    id: 'push-bot-image'
    waitFor: ['build-bot-image']

  # Step 5: Push the dashboard container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard'
    id: 'push-dashboard-image'
    waitFor: ['build-dashboard-image']

  # Step 6: Deploy trading bot to Cloud Run (canary - no traffic)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'options-wheel-strategy'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA'
      - '--region=us-central1'
      - '--memory=512Mi'
      - '--concurrency=10'
      - '--max-instances=1'
      - '--min-instances=0'
      - '--timeout=300'
      - '--set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID'
      - '--no-traffic'
      - '--tag=canary'
    id: 'deploy-bot-canary'
    waitFor: ['push-bot-image']

  # Step 7: Verify the trading bot canary revision is healthy
  # Cannot curl authenticated Cloud Run from Cloud Build, so verify via API
  # that the revision is ready and serving on the canary tag.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying canary revision is ready..."
        # Poll rather than sample once: a revision still coming up reports
        # "Unknown", and a single-shot check turns that race into a false
        # build failure (observed 2026-07-18 — the deploy had succeeded).
        # "False" is a genuine failure and exits immediately.
        for i in $(seq 1 30); do
          STATUS=$(gcloud run revisions list --service=options-wheel-strategy \
            --region=us-central1 --limit=1 \
            --format="value(status.conditions[0].status)")
          echo "attempt $${i}/30 — Bot canary status: $${STATUS}"
          if [ "$${STATUS}" = "True" ]; then
            echo "PASS: Canary revision is ready"
            exit 0
          fi
          if [ "$${STATUS}" = "False" ]; then
            echo "FAIL: Canary revision failed to become ready"
            exit 1
          fi
          sleep 5
        done
        echo "FAIL: timed out after 150s waiting for Bot canary revision"
        exit 1
    id: 'smoke-test-bot'
    waitFor: ['deploy-bot-canary']

  # Step 8: Shift traffic to new trading bot revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'options-wheel-strategy'
      - '--to-latest'
      - '--region=us-central1'
    id: 'promote-bot'
    waitFor: ['smoke-test-bot']

  # Deploy covered-call engine (canary - no traffic). Same image as the wheel;
  # the profile is selected by STRATEGY_CONFIG (FC-075). Runs only after the
  # wheel promoted, so a bad image trips on the wheel's canary first.
  # NOTE: --set-env-vars REPLACES the literal env-var set — these three are the
  # complete intended set. Secret-backed env vars (ALPACA_API_KEY/SECRET -> the
  # -cc secrets, FINNHUB_API_KEY) are a separate list that --set-env-vars does
  # not touch; do NOT add --set-secrets here (a typo'd name would break the
  # service — bindings persist from provisioning, docs/plans/fc-075-cc-deploy-step.md).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'covered-call-engine'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA'
      - '--region=us-central1'
      - '--memory=512Mi'
      - '--concurrency=10'
      - '--max-instances=1'
      - '--min-instances=0'
      - '--timeout=300'
      - '--set-env-vars=ALPACA_PAPER_TRADING=true,GCP_PROJECT=$PROJECT_ID,STRATEGY_CONFIG=config/covered_call.yaml'
      - '--no-traffic'
      - '--tag=canary'
    id: 'deploy-cc-canary'
    waitFor: ['promote-bot']

  # Verify the covered-call canary revision is ready (same poll-not-sample
  # pattern as the wheel's smoke test — a single-shot check races startup).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying covered-call canary revision is ready..."
        for i in $(seq 1 30); do
          STATUS=$(gcloud run revisions list --service=covered-call-engine \
            --region=us-central1 --limit=1 \
            --format="value(status.conditions[0].status)")
          echo "attempt $${i}/30 — CC canary status: $${STATUS}"
          if [ "$${STATUS}" = "True" ]; then
            echo "PASS: CC canary revision is ready"
            exit 0
          fi
          if [ "$${STATUS}" = "False" ]; then
            echo "FAIL: CC canary revision failed to become ready"
            exit 1
          fi
          sleep 5
        done
        echo "FAIL: timed out after 150s waiting for CC canary revision"
        exit 1
    id: 'smoke-test-cc'
    waitFor: ['deploy-cc-canary']

  # Shift traffic to the new covered-call revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'covered-call-engine'
      - '--to-latest'
      - '--region=us-central1'
    id: 'promote-cc'
    waitFor: ['smoke-test-cc']

  # Step 9: Deploy dashboard to Cloud Run (canary - no traffic)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'options-wheel-dashboard'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:$COMMIT_SHA'
      - '--region=us-central1'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--max-instances=2'
      - '--min-instances=0'
      - '--timeout=300'
      # NOTE: --set-env-vars REPLACES the entire env set. Anything applied
      # out-of-band via --update-env-vars is wiped on the next deploy, so
      # every persistent dashboard env var must be declared here.
      - '--set-env-vars=TRADING_BOT_URL=https://options-wheel-strategy-799970961417.us-central1.run.app,GCP_PROJECT=$PROJECT_ID,PAUSE_ALERT_THRESHOLD_DAYS=7'
      - '--no-traffic'
      - '--tag=canary'
    id: 'deploy-dashboard-canary'
    waitFor: ['push-dashboard-image']

  # Step 10: Verify the dashboard canary revision is healthy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Verifying dashboard canary revision is ready..."
        # Poll rather than sample once: a revision still coming up reports
        # "Unknown", and a single-shot check turns that race into a false
        # build failure (observed 2026-07-18 — the deploy had succeeded).
        # "False" is a genuine failure and exits immediately.
        for i in $(seq 1 30); do
          STATUS=$(gcloud run revisions list --service=options-wheel-dashboard \
            --region=us-central1 --limit=1 \
            --format="value(status.conditions[0].status)")
          echo "attempt $${i}/30 — Dashboard canary status: $${STATUS}"
          if [ "$${STATUS}" = "True" ]; then
            echo "PASS: Dashboard canary revision is ready"
            exit 0
          fi
          if [ "$${STATUS}" = "False" ]; then
            echo "FAIL: Dashboard canary revision failed to become ready"
            exit 1
          fi
          sleep 5
        done
        echo "FAIL: timed out after 150s waiting for Dashboard canary revision"
        exit 1
    id: 'smoke-test-dashboard'
    waitFor: ['deploy-dashboard-canary']

  # Step 11: Shift traffic to new dashboard revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'options-wheel-dashboard'
      - '--to-latest'
      - '--region=us-central1'
    id: 'promote-dashboard'
    waitFor: ['smoke-test-dashboard']

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 30

# Service account for Cloud Build
serviceAccount: 'projects/gen-lang-client-0607444019/serviceAccounts/799970961417@cloudbuild.gserviceaccount.com'

# Timeout for the entire build
timeout: '900s'  # 15 minutes (increased for dashboard build)

# Substitutions for build variables
substitutions:
  _SERVICE_NAME: 'options-wheel-strategy'
  _REGION: 'us-central1'

# Images to be pushed to registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-strategy:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/options-wheel/options-wheel-dashboard:latest'